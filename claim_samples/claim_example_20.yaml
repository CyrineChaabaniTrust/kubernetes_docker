# AWS RDS Aurora PostgreSQL Cluster with Multi-AZ and Read Replicas
apiVersion: database.aws.crossplane.io/v1beta1
kind: RDSCluster
metadata:
  name: complex-aurora-postgres
spec:
  forProvider:
    region: eu-west-1
    engine: aurora-postgresql
    engineVersion: "13.6"
    dbClusterParameterGroupName: default.aurora-postgresql13
    dbSubnetGroupName: database-subnet-group
    vpcSecurityGroupIds:
      - sg-0a1b2c3d4e5f6g7h8
    masterUsername: admin
    databaseName: applicationdb
    backupRetentionPeriod: 14
    preferredBackupWindow: "02:00-04:00"
    preferredMaintenanceWindow: "sun:04:00-sun:06:00"
    storageEncrypted: true
    enableIAMDatabaseAuthentication: true
    copyTagsToSnapshot: true
    deletionProtection: true
    enableHttpEndpoint: true
    enabledCloudwatchLogsExports:
      - postgresql
    port: 5432
    scalingConfiguration:
      autoPause: true
      maxCapacity: 32
      minCapacity: 2
      secondsUntilAutoPause: 1800
    serverlessv2ScalingConfiguration:
      minCapacity: 0.5
      maxCapacity: 8.0
    tags:
      Environment: Production
      Application: CustomerPortal
    instances:
      - instanceClass: db.r6g.2xlarge
        availabilityZone: eu-west-1a
        identifier: aurora-instance-primary
        publiclyAccessible: false
        autoMinorVersionUpgrade: true
        monitoringInterval: 30
        performanceInsightsEnabled: true
        performanceInsightsRetentionPeriod: 7
        tags:
          Role: Primary
      - instanceClass: db.r6g.2xlarge
        availabilityZone: eu-west-1b
        identifier: aurora-instance-replica-1
        publiclyAccessible: false
        autoMinorVersionUpgrade: true
        monitoringInterval: 30
        performanceInsightsEnabled: true
        performanceInsightsRetentionPeriod: 7
        tags:
          Role: ReadReplica
      - instanceClass: db.r6g.2xlarge
        availabilityZone: eu-west-1c
        identifier: aurora-instance-replica-2
        publiclyAccessible: false
        autoMinorVersionUpgrade: true
        monitoringInterval: 30
        performanceInsightsEnabled: true
        performanceInsightsRetentionPeriod: 7
        tags:
          Role: ReadReplica
  writeConnectionSecretToRef:
    name: complex-aurora-postgres-conn
    namespace: crossplane-system
  providerConfigRef:
    name: aws-provider 